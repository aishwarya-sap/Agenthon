name: Procurement Agent CI

on:
  push:
    branches: [main, develop]
    paths:
      - "Procurement Bottleneck & Decision Agent/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "Procurement Bottleneck & Decision Agent/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Procurement Bottleneck & Decision Agent/assets/procurement-bottleneck-agent"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app
      - name: Type-check (mypy)
        run: mypy app || true   # advisory until annotations are complete
      - name: Test (offline, mock mode)
        env:
          IBD_TESTING: "1"
        run: pytest
