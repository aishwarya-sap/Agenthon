_schema-version: "3.3.0"
ID: material-risk-cfe01
version: 1.0.0
description: material-risk-agent + Joule-style Chat UI

modules:

  # ── Agent (Python) ──────────────────────────────────────────────
  - name: material-risk-agent
    type: python
    path: assets/material-risk-agent
    parameters:
      buildpack: python_buildpack
      memory: 1G
      disk-quota: 1G
      health-check-type: http
      health-check-http-endpoint: /.well-known/agent.json
    build-parameters:
      builder: custom
      # CF python_buildpack installs requirements.txt at staging using the
      # runtime.txt-pinned Python. Do not pip-install locally.
      commands:
        - echo "deps installed by CF python_buildpack from requirements.txt at staging"
      build-result: .
    properties:
      HOST: 0.0.0.0
      AGENT_PUBLIC_URL: ${default-url}
      # On-prem S/4 via BTP Destination + Cloud Connector (BasicAuthentication).
      S4_SERVICE_PROFILE: onprem
      S4_DESTINATION: S4HANA_DEV_HTTP
      S4_SAP_CLIENT: "150"
      # Decision persistence defaults to in-process; flip to hana after provisioning
      # HANA Cloud + running docs/hana/ZAGENT_DECISION_LOG.sql, and bind the hana service.
      MEMORY_BACKEND: in_memory
      # Inbound identity: set AGENT_AUTH_MODE=ias + IAS_* via scripts/setup-ias-env.sh
      # once the Joule IAS apps are wired. No secrets here — all creds come from the
      # bound services below (VCAP_SERVICES) and the BTP destination.
    provides:
      - name: agent-api
        properties:
          agent-url: ${default-url}
    requires:
      - name: material-risk-aicore
      - name: material-risk-destination
      - name: material-risk-connectivity
      - name: material-risk-xsuaa
      # Bind HANA only when MEMORY_BACKEND=hana (uncomment + create the resource below):
      # - name: material-risk-hana

  # ── UI (Node.js Express) ─────────────────────────────────────────
  - name: material-risk-ui
    type: nodejs
    path: assets/material-risk-ui
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
      build-result: .
    properties:
      AGENT_URL: ~{agent-api/agent-url}
    requires:
      - name: agent-api

resources:
  # SAP AI Core — LLM via Generative AI Hub. _boot.py maps the binding's
  # clientid/clientsecret/url/serviceurls.AI_API_URL into AICORE_* at startup.
  - name: material-risk-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
  # BTP Destination Service — resolves S4HANA_DEV_HTTP at runtime (no creds in repo).
  - name: material-risk-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  # Connectivity Service — Cloud Connector proxy for the on-prem S/4 destination.
  - name: material-risk-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  # XSUAA — secures the agent's HTTP endpoints (xs-security.json).
  - name: material-risk-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./assets/material-risk-agent/xs-security.json
  # HANA Cloud — durable decision/approval audit (optional; enable with MEMORY_BACKEND=hana).
  # Uncomment and bind in the agent module's requires when provisioning HANA.
  # - name: material-risk-hana
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: hana
  #     service-plan: hdi-shared
