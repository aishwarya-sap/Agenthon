# Function = the executable logic Joule runs when the scenario matches.
# Multi-turn A2A: the agent-request action calls our remote CF agent over A2A via the
# PROCUREMENT_AGENT system alias (-> BTP destination). On the first turn contextId/taskId
# are null (new task); on a follow-up (e.g. the HITL "approve" turn) they are sent back so
# the agent resumes the same task. The agent returns an A2A Task object; Joule reads the
# reply from status.message.parts[0].text and persists id/contextId for the next turn.
parameters:
  - name: contextId
    optional: true
  - name: taskId
    optional: true

action_groups:
  - actions:
      - type: status-update
        message: <? "Analysing procurement bottlenecks..." ?>

      - type: agent-request
        agent_type: remote                # remote = code-based A2A (BYOA) agent on CF
        system_alias: PROCUREMENT_AGENT    # -> destination defined in capability.sapdas.yaml
        body: >
          <? (contextId == null || contextId.isEmpty()) && (taskId == null || taskId.isEmpty())
             ? null
             : '{ "contextId": "' + contextId + '", "taskId": "' + taskId + '" }' ?>
        result_variable: result

      - type: set-variables
        variables:
          - name: contextId
            value: <? result.body.contextId ?>
          - name: taskId
            value: <? result.body.id ?>

      - type: message
        message:
          type: text
          content: "<? result.body.status.message.parts[0].text ?>"
          markdown: true

result:
  contextId: "<? contextId ?>"
  taskId: "<? taskId ?>"
