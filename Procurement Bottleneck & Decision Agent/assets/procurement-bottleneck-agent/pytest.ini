[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -q --cov=app --cov-report=term-missing --cov-fail-under=70 --json-report --json-report-file=test_report.json
markers =
    unit: single-tool / single-function unit tests
    integration: end-to-end agent graph tests (LLM mocked, mock tools)
    server: A2A server surface tests
    security: adversarial / red-team and injection-gate tests
