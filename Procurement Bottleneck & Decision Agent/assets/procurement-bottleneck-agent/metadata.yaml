# Component descriptor — update the URLs below once the CF app is deployed
# to your BTP subaccount (replace <your-cf-app-url> with the actual CF route).
kind: component
metadata:
  name: procurement-bottleneck-decision-agent
  displayName: Procurement Bottleneck & Decision Agent
  description: >
    A2A agent that detects supplier silence on critical-path procurement
    orders, quantifies downstream project consequence (schedule slip, idle-resource
    cost, penalty exposure, emergency-sourcing premium), and presents a
    human-approved ranked recommendation — advisory-only, no SAP writes.
  tags:
    - a2a
    - procurement
    - supply-chain
    - sap-btp
    - advisory-only
spec:
  type:
    name: a2a-agent
    lifecycle: development
    categories:
      - python
      - starlette
      - a2a
  team:
    technicalOwner: ""       # fill with your S-/D-/I-user ID
    contactChannels:
      - channelType: email
        value: ""            # fill with team DL or owner email
  ci:
    pipelineLinks:
      - name: CF App
        url: https://<your-cf-app-url>
        icon: .sap-icon--factory
        description: Deployed CF application
  docs:
    techDocsLinks:
      - name: Reference Doc
        url: https://<your-cf-app-url>
        icon: .sap-icon--sys-help-2
        description: Agent documentation
  links:
    - name: Agent URL
      url: https://<your-cf-app-url>
      icon: .sap-icon--factory
    - name: Health Check
      url: https://<your-cf-app-url>/health
      icon: .sap-icon--factory
  exposes:
    - api:procurement-bottleneck-a2a
  dependsOn:
    - api:sap-ai-core
