[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurement-bottleneck-decision-agent"
version = "1.0.0"
description = "Advisory, read-only SAP A2A agent that detects supplier silence on critical-path purchase orders, quantifies the delivery/schedule consequence, and recommends an action for Purchasing-HoD approval."
requires-python = ">=3.11"

# Mirror of requirements.txt (the CF buildpack lock). The litellm/langchain stack is
# PINNED to the exact versions proven to resolve the SAP AI Core `sap/...` provider on CF
# (see docs/decisions/0003). Regenerate the lock with ./freeze-deps.sh.
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyJWT[crypto]>=2.8",
    "litellm==1.94.1",
    "langchain==1.3.10",
    "langchain-core==1.6.1",
    "langchain-litellm==0.7.1",
    "langgraph==1.2.6",
    "openpyxl>=3.1",
    "pypdf>=4.2",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "A", "ASYNC", "TRY", "C90"]
# S104: binds 0.0.0.0 (server, expected on CF). TRY003: operator-facing messages are long by design.
ignore = ["S104", "TRY003", "TRY300", "TRY301", "TRY400"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true

# NOTE: pytest configuration remains in pytest.ini (single source of truth). When the
# repo fully migrates to pyproject, move it here as [tool.pytest.ini_options] and delete pytest.ini.
