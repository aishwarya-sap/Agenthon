<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP AI Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="rail" id="rail">
      <button class="rail-grid" title="Apps">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </button>
      <div class="rail-logo" title="Home">
        <img src="joule-logo.jpg" alt="Joule" width="34" height="34" />
      </div>
      <nav class="rail-nav">
        <button class="rail-btn active" title="Chat">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 10h8M8 14h5"/>
            <path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"/>
          </svg>
        </button>
      </nav>
      <div class="rail-bottom">
        <button class="rail-btn rail-expand" title="Expand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 7 12 12 7 17"/><polyline points="13 7 18 12 13 17"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" title="Toggle panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/>
          </svg>
        </button>
        <span class="topbar-title" id="topbarTitle">New Conversation</span>
      </header>

      <div class="conversation" id="conversation">
        <div class="chat-scroll" id="chatArea">
          <div class="center-col">
            <div class="welcome" id="welcome">
              <div class="welcome-icon">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                  <path d="M14 14h30a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H26l-10 8v-8h-2a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z" fill="url(#bubbleGrad)"/>
                  <path d="M20 24h22M20 30h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
                  <defs>
                    <linearGradient id="bubbleGrad" x1="8" y1="14" x2="50" y2="48" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#A78BFA"/>
                      <stop offset="60%" stop-color="#7C3AED"/>
                      <stop offset="100%" stop-color="#6D28D9"/>
                    </linearGradient>
                  </defs>
                </svg>
              </div>
              <h1 class="welcome-title">How can I help you?</h1>
            </div>
            <div class="messages" id="messages"></div>
          </div>
        </div>

        <div class="input-region">
          <div class="center-col">
            <div class="input-box" id="inputBox">
              <textarea
                id="messageInput"
                placeholder="Message Joule..."
                rows="1"
                autocomplete="off"
                maxlength="8000"
              ></textarea>
              <div class="input-actions">
                <div class="input-left">
                  <button class="input-btn" title="Attach" tabindex="-1">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                  </button>
                </div>
                <div class="input-right">
                  <span class="char-warning" id="charWarning"></span>
                  <button class="send-btn" id="sendBtn" disabled title="Send">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
            <div class="input-footer">
              <span class="prompt-library-link">View Prompt Library</span>
            </div>
          </div>
        </div>
      </div>

      <div class="page-footer">Joule uses AI. Verify results.</div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
