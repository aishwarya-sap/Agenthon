---
applications:
  - name: agent-starter-kit             # TODO: rename to your agent name (kebab-case)
    memory: 512M              # Sprint 1–2 default. Scale to 1G for production workloads.
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: python -m app
    health-check-type: http
    health-check-http-endpoint: /.well-known/agent.json
    timeout: 180
    env:
      AGENT_MODEL: sap/anthropic--claude-4-5-sonnet
      AGENT_MODEL_FALLBACK: sap/anthropic--claude-3-5-haiku
      AICORE_RESOURCE_GROUP: default
      # Auth mode: ias (production/Joule) | xsuaa (legacy) | none (dev-only, never prod)
      AGENT_AUTH_MODE: ias
      IBD_TESTING: "0"
      TOKEN_BUDGET_PER_RUN: "50000"
      RAG_SIMILARITY_GATE: "0.80"
      # TODO: set to your CF app public URL (used in agent card)
      AGENT_PUBLIC_URL: https://agent-starter-kit.cfapps.<region>.hana.ondemand.com
    services:
      - agent-aicore       # TODO: cf create-service aicore ... (SAP AI Core binding)
      # - agent-xsuaa      # Uncomment: cf create-service xsuaa application -c xs-security.json
      # - agent-dest       # Uncomment for Destination service (Sprint 3+)
