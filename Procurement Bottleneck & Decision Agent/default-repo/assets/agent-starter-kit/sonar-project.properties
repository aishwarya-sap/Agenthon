# SonarQube configuration for SAP A2A Agent
# Run: sonar-scanner (from this directory)
# Requires: SONAR_TOKEN env var + SonarQube/SonarCloud project created

sonar.projectKey=GDH-AIFactory-CodeAgents-KG_<YourAgentName>      # TODO: rename
sonar.projectName=<Your Agent Display Name>                         # TODO: rename
sonar.projectVersion=1.0.0

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions — keep sonar focused on business logic only
sonar.exclusions=**/demo/**,**/__pycache__/**,**/.venv/**,**/eval/**,**/governance/**
sonar.coverage.exclusions=**/tests/**,**/conftest.py,**/__main__.py

# Quality gate — fail if coverage drops below 70% or any blocker/critical issue found
sonar.qualitygate.wait=true
