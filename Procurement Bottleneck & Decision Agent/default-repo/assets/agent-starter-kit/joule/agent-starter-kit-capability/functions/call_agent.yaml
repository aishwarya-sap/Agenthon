# Multi-turn A2A function. agent-request calls the remote CF agent via the system alias;
# contextId/taskId are null on the first turn and sent back on follow-ups so the agent
# resumes the same task. The agent returns an A2A Task; Joule reads the reply from
# status.message.parts[0].text and persists id/contextId for the next turn.
parameters:
  - name: contextId
    optional: true
  - name: taskId
    optional: true

action_groups:
  - actions:
      - type: status-update
        message: <? "Working..." ?>              # TODO: domain-specific progress text

      - type: agent-request
        agent_type: remote                         # remote = code-based A2A (BYOA) agent
        system_alias: AGENT_STARTER_KIT            # TODO: match alias in capability.sapdas.yaml
        body: >
          <? (contextId == null || contextId.isEmpty()) && (taskId == null || taskId.isEmpty())
             ? null
             : '{ "contextId": "' + contextId + '", "taskId": "' + taskId + '" }' ?>
        result_variable: result

      - type: set-variables
        variables:
          - name: contextId
            value: <? result.body.contextId ?>
          - name: taskId
            value: <? result.body.id ?>

      - type: message
        message:
          type: text
          content: "<? result.body.status.message.parts[0].text ?>"
          markdown: true

result:
  contextId: "<? contextId ?>"
  taskId: "<? taskId ?>"
